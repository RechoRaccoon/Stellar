# XcodeGen spec — CI runs `xcodegen generate` here to produce
# iosApp.xcodeproj, so no hand-maintained .pbxproj is committed.
name: iosApp
options:
  bundleIdPrefix: rechoraccoon
  deploymentTarget:
    iOS: "16.0"
# ONNX Runtime (Microsoft, MIT licence): runs the AI Tagging model on the
# device — the same model file Android uses. Fetched by Xcode when the
# project is built.
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.19.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Fonts/images from shared/src/commonMain/composeResources, copied here
      # by the workflow (see ios.yml) — Compose reads them from
      # Stellar.app/compose-resources at runtime.
      - path: compose-resources
        type: folder
        buildPhase: resources
    scheme: {}
    # The home-screen widgets are an extension inside the app.
    dependencies:
      - target: StellarWidgets
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_NAME: Stellar
        # The app and its widgets share one small store (what the widgets
        # show) through this app group. It only takes effect on a signed
        # build; the unsigned CI build ignores it.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: rechoraccoon.stellar
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        # The Kotlin framework (static) is built by Gradle before xcodebuild
        # runs — see .github/workflows/ios.yml.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        # The system frameworks the Kotlin code uses (video, web embeds,
        # photo picker, file types).
        OTHER_LDFLAGS: "$(inherited) -framework Shared -framework AVFoundation -framework AVFAudio -framework AVKit -framework CoreMedia -framework WebKit -framework Photos -framework PhotosUI -framework UniformTypeIdentifiers -framework CoreVideo -framework QuartzCore -framework NaturalLanguage -framework WidgetKit"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # Stellar's home-screen widgets (DMs, Upcoming Events, Note): plain
  # SwiftUI/WidgetKit, no Kotlin. They read what the app saves for them in
  # the shared app group (see IosWidgetBridge in the Kotlin code).
  StellarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - StellarWidgets
      # The app's own font, for the widgets' titles.
      - path: ../shared/src/commonMain/composeResources/font/audiowide.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: StellarWidgets
        PRODUCT_BUNDLE_IDENTIFIER: rechoraccoon.stellar.widgets
        INFOPLIST_FILE: StellarWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_ENTITLEMENTS: StellarWidgets/StellarWidgets.entitlements
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
