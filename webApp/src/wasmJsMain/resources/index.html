<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Stellar — an open-source social app for the AT Protocol">
    <title>Stellar</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
        }
        /* Compose's canvas sits above the video layer (see WebVideo.kt). */
        body > canvas, body > div:not(#stellar-video-layer):not(#splash) {
            position: relative;
            z-index: 1;
        }
        /* The start-up screen, in the look of the app's own loading
           animation: deep space tinted Stellar pink (#FF4FA1 — the color
           Override App Colors starts on), soft stars, and the Stellar logo
           ("Created by Recho Raccoon") big and a little above centre, with
           a slow glow. */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
            padding-bottom: 12vh;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(255, 79, 161, 0.20), rgba(255, 79, 161, 0) 62%),
                radial-gradient(ellipse at 50% 110%, rgba(255, 79, 161, 0.12), rgba(255, 79, 161, 0) 55%),
                #0a0509;
            color: #c9a3b8;
            font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
            transition: opacity 0.35s ease;
            overflow: hidden;
        }
        #splash::before, #splash::after {
            content: ""; position: absolute; inset: -50%;
            background-image:
                radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.8), transparent 60%),
                radial-gradient(1.1px 1.1px at 28% 72%, rgba(255,255,255,0.6), transparent 60%),
                radial-gradient(1.6px 1.6px at 47% 33%, rgba(255,255,255,0.75), transparent 60%),
                radial-gradient(1.0px 1.0px at 63% 84%, rgba(255,255,255,0.55), transparent 60%),
                radial-gradient(1.3px 1.3px at 78% 22%, rgba(255,255,255,0.7), transparent 60%),
                radial-gradient(1.0px 1.0px at 89% 58%, rgba(255,255,255,0.5), transparent 60%),
                radial-gradient(1.2px 1.2px at 6% 64%, rgba(255,255,255,0.6), transparent 60%),
                radial-gradient(1.5px 1.5px at 36% 9%, rgba(255,255,255,0.65), transparent 60%),
                radial-gradient(1.1px 1.1px at 55% 56%, rgba(255,255,255,0.45), transparent 60%),
                radial-gradient(1.0px 1.0px at 71% 46%, rgba(255,255,255,0.5), transparent 60%);
            background-size: 340px 340px;
            animation: drift 90s linear infinite;
            pointer-events: none;
        }
        #splash::after { background-size: 520px 520px; opacity: 0.6; animation-duration: 140s; }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-340px); } }
        #splash .logo {
            position: relative;
            width: min(74vw, 400px);
            filter: drop-shadow(0 0 18px rgba(255, 79, 161, 0.45));
            animation: breathe 4.5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(255, 79, 161, 0.35)); }
            50% { transform: scale(1.015); filter: drop-shadow(0 0 24px rgba(255, 79, 161, 0.6)); }
        }
        #splash .bar { position: relative; width: 180px; height: 3px; border-radius: 2px; background: rgba(255, 79, 161, 0.18); overflow: hidden; }
        #splash .bar::after {
            content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, #ff4fa1, #ff8cc4);
            animation: slide 1.1s ease-in-out infinite;
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        #unsupported { position: relative; display: none; max-width: 320px; text-align: center; line-height: 1.5; }
        /* The app is drawn on a canvas: never let the browser pick it (or a
           video) up as a picture to drag — a slightly moved double tap would
           otherwise start one, and dropping it opens the image in a new tab. */
        canvas, video { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    </style>
    <script>
        // (The same, for browsers that ignore the style: Stellar does its own dragging.)
        document.addEventListener('dragstart', (e) => e.preventDefault(), true);
        document.addEventListener('drop', (e) => e.preventDefault(), true);
        document.addEventListener('dragover', (e) => e.preventDefault(), true);
    </script>
</head>
<body>
    <div id="splash">
        <img class="logo" src="stellar-logo.svg" alt="Stellar — Created by Recho Raccoon">
        <div class="bar"></div>
        <div id="unsupported">
            Stellar needs a newer browser (Chrome or Edge 119+, Firefox 120+, Safari 18.2+).
        </div>
    </div>
    <!-- Bluesky's videos are HLS streams; hls.js plays them where the browser can't by itself. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
    <script>
        // Kotlin/Wasm needs WebAssembly garbage collection (and exception handling).
        (function () {
            var ok = false;
            try {
                // A module using a GC struct type: only browsers with Wasm GC accept it.
                ok = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([
                    0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0
                ]));
            } catch (e) { ok = false; }
            if (!ok) {
                document.querySelector('#splash .bar').style.display = 'none';
                document.getElementById('unsupported').style.display = 'block';
            } else {
                var s = document.createElement('script');
                s.src = 'stellar.js';
                document.body.appendChild(s);
            }
        })();
    </script>
</body>
</html>
