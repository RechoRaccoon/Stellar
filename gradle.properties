android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# iOS targets can't build on the Linux Android runner; skip them quietly.
kotlin.native.ignoreDisabledTargets=true
# Give the Kotlin compiler daemon its own heap: the iOS (Kotlin/Native)
# framework build OOMs on the default daemon heap.
kotlin.daemon.jvmargs=-Xmx3g
# R8 in its compatible mode (keeps default constructors and the like that
# reflection-heavy libraries expect) — see androidApp/proguard-rules.pro.
android.enableR8.fullMode=false
