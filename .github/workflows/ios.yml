name: Build Stellar iOS

# Separate from build.yml so an iOS failure never blocks the Android APK.
on:
  push:
    branches: [ main ]
  # Run by hand (Actions › Build Stellar iOS › Run workflow) to try the
  # other kind of Mac GitHub offers. The usual one (macos-15) has 7 GB of
  # memory, which the Kotlin build fills; macos-15-intel has 14 GB and
  # four processors. If it builds faster there, change the default below.
  workflow_dispatch:
    inputs:
      runner:
        description: Which Mac to build on
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

# One iOS build at a time: a newer push stops the build of the one before
# it. (They take about an hour each, and two at once only slow each other.)
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build unsigned iOS app
    runs-on: ${{ inputs.runner || 'macos-15' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      # The Kotlin/Native compiler + iOS libraries (~1 GB), kept between
      # runs so they aren't downloaded every time.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle.properties') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Kotlin framework (iPhone)
        run: gradle :shared:linkReleaseFrameworkIosArm64 --stacktrace

      # Compose Multiplatform reads fonts/images from the app bundle's
      # compose-resources folder (Res.font.audiowide, the Stellar logo…).
      - name: Copy Compose resources into the app
        run: |
          DEST=iosApp/compose-resources/composeResources/com.mediaviewer.resources
          rm -rf iosApp/compose-resources
          mkdir -p "$DEST"
          cp -R shared/src/commonMain/composeResources/. "$DEST/"
          find iosApp/compose-resources -type f

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build unsigned device app (.ipa)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Stellar.app Payload/
          zip -qry Stellar-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-iOS-unsigned
          path: Stellar-unsigned.ipa
          retention-days: 30
