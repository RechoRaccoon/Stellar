name: Build Stellar Web

# The web version (Kotlin/Wasm in the browser): the same shared code as
# Android, iOS and desktop, built on every push like the others. Pushes to
# main also publish it on GitHub Pages (https://rechoraccoon.github.io/Stellar/).
#
# One-time setup for publishing: repository Settings → Pages → Build and
# deployment → Source: "GitHub Actions".
on:
  # Every push, on any branch: every version is built from the same commit.
  push:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      # --no-build-cache: the .wasm must always really be rebuilt (a cached
      # result once left a site without its binary). Linking the whole app
      # into one .wasm needs more memory than the other builds give the
      # Kotlin compiler (gradle.properties: 3 GB), so this one gets 7 GB of
      # the runner's 16.
      - name: Build the site
        run: gradle :webApp:wasmJsBrowserDistribution --stacktrace --no-build-cache "-Pkotlin.daemon.jvmargs=-Xmx7g -XX:+UseParallelGC"

      # The fonts a browser can't lend the page (see shared/src/wasmJsMain/
      # kotlin/com/mediaviewer/util/WebFonts.kt), next to the app. Too big to
      # keep in the repository; fetched fresh for each build.
      - name: Add fonts
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          mkdir -p "$DIST/fonts"
          get() { curl -fsSL --retry 4 -o "$DIST/fonts/$1" "$2"; }
          get NotoSans-Regular.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf/NotoSans-Regular.ttf
          get NotoSans-Bold.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf/NotoSans-Bold.ttf
          get NotoColorEmoji.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf
          # Symbols and decorations people use in names (★ ⛧ ♰, the Bamum 𖤐).
          get NotoSansSymbols-Regular.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansSymbols/hinted/ttf/NotoSansSymbols-Regular.ttf
          get NotoSansSymbols2-Regular.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansSymbols2/hinted/ttf/NotoSansSymbols2-Regular.ttf
          get NotoSansBamum-Regular.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansBamum/hinted/ttf/NotoSansBamum-Regular.ttf
          get NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          get NotoSansCJKkr-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf
          get NotoSansCJKsc-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          ls -la "$DIST/fonts"

      # Refuse to publish a site whose loader can't find its binary.
      - name: Check the site
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          test -s "$DIST/index.html"
          test -s "$DIST/stellar.js"
          WASMS=$(grep -o '"[^"]*\.wasm"' "$DIST/stellar.js" | tr -d '"' | sed 's#^\./##' | sort -u)
          echo "The loader asks for: $WASMS"
          test -n "$WASMS"
          for W in $WASMS; do
            if [ ! -s "$DIST/$W" ]; then
              echo "::error::$W is missing from the site"
              exit 1
            fi
          done
          # GitHub Pages: no Jekyll processing of the files.
          touch "$DIST/.nojekyll"
          du -sh "$DIST"

      # Each build's app files get names of their own (the commit's), so a
      # browser can never keep running an older build from its cache:
      # the page (cached for minutes at most) asks for this build's script,
      # and the script for this build's binary.
      - name: Name the files after this build
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          V="${GITHUB_SHA::8}"
          for W in $(grep -o '"[^"]*\.wasm"' "$DIST/stellar.js" | tr -d '"' | sed 's#^\./##' | sort -u); do
            N="${W%.wasm}-$V.wasm"
            mv "$DIST/$W" "$DIST/$N"
            sed -i "s#\"\./$W\"#\"./$N\"#g; s#\"$W\"#\"$N\"#g" "$DIST/stellar.js"
            test -s "$DIST/$N"
          done
          mv "$DIST/stellar.js" "$DIST/stellar-$V.js"
          sed -i "s#'stellar.js'#'stellar-$V.js'#" "$DIST/index.html"
          grep -q "stellar-$V.js" "$DIST/index.html"
          grep -o '"[^"]*\.wasm"' "$DIST/stellar-$V.js" | sort -u

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Web
          path: webApp/build/dist/wasmJs/productionExecutable
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload for GitHub Pages
        # (The fix branch publishes too, so its build can be tested at the
        # usual Pages link before it lands on main; main's next publish
        # puts main's build back.)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/home-slider-status-emoji'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  # Publishes the site (main, and the fix branch while it's being tested).
  pages:
    name: Publish to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/home-slider-status-emoji'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
