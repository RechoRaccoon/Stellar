name: Build Stellar Web

# The web version (Kotlin/Wasm in the browser): the same shared code as
# Android, iOS and desktop, built on every push like the others. Pushes to
# main also publish it on GitHub Pages (https://rechoraccoon.github.io/Stellar/).
#
# One-time setup for publishing: repository Settings → Pages → Build and
# deployment → Source: "GitHub Actions".
on:
  # Every push, on any branch: every version is built from the same commit.
  push:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      # --no-build-cache: the .wasm must always really be rebuilt (a cached
      # result once left a site without its binary).
      - name: Build the site
        run: gradle :webApp:wasmJsBrowserDistribution --stacktrace --no-build-cache

      # The fonts a browser can't lend the page (see shared/src/wasmJsMain/
      # kotlin/com/mediaviewer/util/WebFonts.kt), next to the app. Too big to
      # keep in the repository; fetched fresh for each build.
      - name: Add fonts
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          mkdir -p "$DIST/fonts"
          get() { curl -fsSL --retry 4 -o "$DIST/fonts/$1" "$2"; }
          get NotoSans-Regular.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf/NotoSans-Regular.ttf
          get NotoSans-Bold.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf/NotoSans-Bold.ttf
          get NotoColorEmoji.ttf https://raw.githubusercontent.com/googlefonts/noto-emoji/main/fonts/NotoColorEmoji.ttf
          get NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          get NotoSansCJKkr-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf
          get NotoSansCJKsc-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          ls -la "$DIST/fonts"

      # Refuse to publish a site whose loader can't find its binary.
      - name: Check the site
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          test -s "$DIST/index.html"
          test -s "$DIST/stellar.js"
          WASM=$(grep -o '"[^"]*\.wasm"' "$DIST/stellar.js" | head -n 1 | tr -d '"' | sed 's#^\./##')
          echo "The loader asks for: $WASM"
          if [ -z "$WASM" ] || [ ! -s "$DIST/$WASM" ]; then
            echo "::error::$WASM is missing from the site"
            exit 1
          fi
          # GitHub Pages: no Jekyll processing of the files.
          touch "$DIST/.nojekyll"
          du -sh "$DIST"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Web
          path: webApp/build/dist/wasmJs/productionExecutable
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  # Publishes the site (main only).
  pages:
    name: Publish to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
