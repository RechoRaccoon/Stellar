name: Build Stellar Desktop

# Windows and macOS installers. Separate from build.yml and ios.yml so a
# desktop failure never blocks the APK or the iOS build. Each installer
# is built on its own system: the app bundles that system's FFmpeg and
# JavaFX (see shared/build.gradle.kts).
on:
  # Every push, on any branch: Android, iOS, Windows and macOS are all
  # built from the same commit.
  push:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            runner: windows-latest
            tasks: ":desktopApp:packageMsi :desktopApp:packageExe"
            artifact: Stellar-Windows
          - name: macOS installer (Apple silicon)
            runner: macos-15
            tasks: ":desktopApp:packageDmg"
            artifact: Stellar-macOS-AppleSilicon
          - name: macOS installer (Intel)
            runner: macos-15-intel
            tasks: ":desktopApp:packageDmg"
            artifact: Stellar-macOS-Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build installer
        run: gradle ${{ matrix.tasks }} --stacktrace

      # Plain names for the download page: Stellar-Windows.msi / .exe,
      # Stellar-macOS-AppleSilicon.dmg, Stellar-macOS-Intel.dmg.
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          for f in desktopApp/build/compose/binaries/main/*/*.{msi,exe,dmg}; do
            [ -e "$f" ] || continue
            cp "$f" "out/${{ matrix.artifact }}.${f##*.}"
          done
          ls -la out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          retention-days: 90
